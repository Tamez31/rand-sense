<title>RandSense — Making CENTS of it all</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --forest: #0D3B1E;
    --forest-deep: #072714;
    --mint: #7EEAA8;
    --gold: #D4A843;
    --white: #FFFFFF;
    --white-60: rgba(255,255,255,0.6);
    --white-12: rgba(255,255,255,0.12);

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .viewport {
    width: 1080px;
    height: 1920px;
    background: var(--forest);
    position: relative;
    overflow: hidden;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle texture overlay */
  .viewport::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(126,234,168,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── SCENE 1: Logo + Wordmark + Tagline (0-3s) ─── */
  .scene-1 {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    animation: scene1-in 0.6s var(--ease-out) 0.2s forwards,
               scene1-out 0.5s var(--ease-in-out) 2.8s forwards;
  }

  .logo-icon {
    width: 220px;
    height: 220px;
    background: var(--forest-deep);
    border-radius: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 48px;
    opacity: 0;
    transform: scale(0.7);
    animation: pop-in 0.7s var(--ease-out) 0.3s forwards;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  }

  .logo-icon span {
    font-size: 120px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -2px;
  }

  .wordmark {
    font-size: 130px;
    font-weight: 700;
    letter-spacing: -4px;
    opacity: 0;
    transform: translateY(20px);
    animation: slide-fade-in 0.6s var(--ease-out) 0.7s forwards;
  }

  .wordmark .rand { color: var(--white); }
  .wordmark .sense { color: var(--mint); }

  .tagline-intro {
    font-size: 40px;
    font-weight: 500;
    color: var(--white-60);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 24px;
    opacity: 0;
    transform: translateY(14px);
    animation: slide-fade-in 0.5s var(--ease-out) 1.1s forwards;
  }

  /* ─── SCENE 2: Tax Season Headline (3-8s) ─── */
  .scene-2 {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9;
    opacity: 0;
    animation: scene-fade-in 0.5s var(--ease-out) 3.2s forwards,
               scene-fade-out 0.5s var(--ease-in-out) 7.6s forwards;
  }

  .headline-container {
    text-align: center;
    padding: 0 80px;
  }

  .headline-word {
    display: inline-block;
    font-size: 148px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -4px;
    line-height: 1.1;
    opacity: 0;
    transform: translateY(40px);
  }

  .headline-word:nth-child(1) { animation: word-in 0.5s var(--ease-out) 3.5s forwards; }
  .headline-word:nth-child(2) { animation: word-in 0.5s var(--ease-out) 3.65s forwards; }
  .headline-word:nth-child(3) { animation: word-in 0.5s var(--ease-out) 3.8s forwards; }
  .headline-word:nth-child(4) { animation: word-in 0.5s var(--ease-out) 3.95s forwards; }

  .headline-accent {
    display: block;
    width: 100px;
    height: 5px;
    background: var(--mint);
    border-radius: 2px;
    margin: 40px auto 0;
    opacity: 0;
    transform: scaleX(0);
    animation: bar-in 0.6s var(--ease-out) 4.3s forwards;
  }

  .scene-2 .sub-text {
    font-size: 48px;
    font-weight: 400;
    color: var(--white-60);
    margin-top: 40px;
    opacity: 0;
    transform: translateY(16px);
    animation: slide-fade-in 0.5s var(--ease-out) 4.6s forwards;
  }

  /* ─── SCENE 3: CTA + Phone (8-13s) ─── */
  .scene-3 {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 8;
    opacity: 0;
    animation: scene-fade-in 0.5s var(--ease-out) 8.2s forwards,
               scene-fade-out 0.5s var(--ease-in-out) 12.6s forwards;
  }

  .cta-icon {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #25D366;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 48px;
    opacity: 0;
    transform: scale(0.6);
    animation: pop-in 0.6s var(--ease-out) 8.5s forwards;
    box-shadow: 0 4px 24px rgba(37,211,102,0.3);
  }

  .cta-icon svg {
    width: 60px;
    height: 60px;
    fill: var(--white);
  }

  .cta-text {
    font-size: 64px;
    font-weight: 500;
    color: var(--white);
    text-align: center;
    line-height: 1.35;
    padding: 0 80px;
    opacity: 0;
    transform: translateY(24px);
    animation: slide-fade-in 0.6s var(--ease-out) 8.9s forwards;
  }

  .phone-number {
    font-size: 88px;
    font-weight: 700;
    color: var(--gold);
    margin-top: 56px;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    animation: slide-fade-in 0.6s var(--ease-out) 9.6s forwards,
               pulse-glow 2s var(--ease-in-out) 10.2s 2;
  }

  /* ─── SCENE 4: Closing Tag (13-16s) ─── */
  .scene-4 {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 7;
    opacity: 0;
    animation: scene-fade-in 0.6s var(--ease-out) 13.0s forwards;
  }

  .closing-logo {
    width: 180px;
    height: 180px;
    background: var(--forest-deep);
    border-radius: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
    opacity: 0;
    transform: scale(0.7);
    animation: pop-in 0.6s var(--ease-out) 13.3s forwards;
    box-shadow: 0 6px 30px rgba(0,0,0,0.25);
  }

  .closing-logo span {
    font-size: 96px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -1px;
  }

  .closing-tagline {
    font-size: 76px;
    font-weight: 600;
    color: var(--white);
    text-align: center;
    opacity: 0;
    transform: translateY(16px);
    animation: slide-fade-in 0.6s var(--ease-out) 13.6s forwards;
  }

  .closing-tagline em {
    font-style: normal;
    color: var(--mint);
  }

  .closing-wordmark {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-top: 28px;
    opacity: 0;
    animation: fade-in 0.5s var(--ease-out) 14.0s forwards;
  }

  .closing-wordmark .rand { color: var(--white); }
  .closing-wordmark .sense { color: var(--mint); }

  /* ─── Watermark (persistent from scene 2) ─── */
  .watermark {
    position: absolute;
    bottom: 60px;
    right: 60px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 20;
    opacity: 0;
    animation: fade-in 0.5s var(--ease-out) 3.4s forwards,
               fade-out 0.4s var(--ease-in-out) 12.8s forwards;
  }

  .watermark-icon {
    width: 48px;
    height: 48px;
    background: var(--forest-deep);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .watermark-icon span {
    font-size: 26px;
    font-weight: 700;
    color: var(--white);
  }

  .watermark-text {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .watermark-text .rand { color: var(--white); }
  .watermark-text .sense { color: var(--mint); }

  /* ─── Keyframes ─── */
  @keyframes scene1-in {
    to { opacity: 1; }
  }
  @keyframes scene1-out {
    to { opacity: 0; transform: scale(0.96); }
  }
  @keyframes scene-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes scene-fade-out {
    to { opacity: 0; }
  }
  @keyframes pop-in {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slide-fade-in {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes word-in {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bar-in {
    to { opacity: 1; transform: scaleX(1); }
  }
  @keyframes fade-in {
    to { opacity: 1; }
  }
  @keyframes fade-out {
    to { opacity: 0; }
  }
  @keyframes pulse-glow {
    0%, 100% { transform: scale(1); text-shadow: 0 0 0 transparent; }
    50% { transform: scale(1.04); text-shadow: 0 0 30px rgba(212,168,67,0.4); }
  }

  /* Scale for browser preview */
  @media (max-height: 1920px) {
    .viewport {
      transform-origin: top center;
      transform: scale(var(--preview-scale, 1));
    }
  }
</style>

<div class="viewport" id="viewport">
  <!-- Scene 1: Logo + Wordmark + Tagline -->
  <div class="scene-1">
    <div class="logo-icon"><span>R</span></div>
    <div class="wordmark"><span class="rand">Rand</span><span class="sense">Sense</span></div>
    <div class="tagline-intro">Making CENTS of it all</div>
  </div>

  <!-- Scene 2: Headline -->
  <div class="scene-2">
    <div class="headline-container">
      <span class="headline-word">TAX&nbsp;</span>
      <span class="headline-word">SEASON&nbsp;</span>
      <span class="headline-word">IS&nbsp;</span>
      <span class="headline-word">HERE</span>
      <span class="headline-accent"></span>
    </div>
    <div class="sub-text">Don't get caught off guard</div>
  </div>

  <!-- Scene 3: CTA + Phone -->
  <div class="scene-3">
    <div class="cta-icon">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 00.612.616l4.524-1.467A11.955 11.955 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-2.137 0-4.146-.651-5.807-1.867l-.405-.293-2.684.87.893-2.632-.316-.42A9.935 9.935 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
    </div>
    <div class="cta-text">Drop me a WhatsApp<br>and let us get you<br>up to date</div>
    <div class="phone-number">076 140 8717</div>
  </div>

  <!-- Scene 4: Closing -->
  <div class="scene-4">
    <div class="closing-logo"><span>R</span></div>
    <div class="closing-tagline">Make <em>CENTS</em> of it all</div>
    <div class="closing-wordmark"><span class="rand">Rand</span><span class="sense">Sense</span></div>
  </div>

  <!-- Watermark (scenes 2-3) -->
  <div class="watermark">
    <div class="watermark-icon"><span>R</span></div>
    <div class="watermark-text"><span class="rand">Rand</span><span class="sense">Sense</span></div>
  </div>
</div>

<script>
  // Auto-scale viewport to fit browser window
  function scaleViewport() {
    const vp = document.getElementById('viewport');
    const scaleX = window.innerWidth / 1080;
    const scaleY = window.innerHeight / 1920;
    const scale = Math.min(scaleX, scaleY, 1);
    vp.style.setProperty('--preview-scale', scale);
    vp.style.transform = `scale(${scale})`;
    vp.style.transformOrigin = 'top center';
  }
  scaleViewport();
  window.addEventListener('resize', scaleViewport);
</script>
